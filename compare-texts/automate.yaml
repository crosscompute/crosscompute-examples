---
crosscompute: 0.9.5
name: Compare Text
description: Compare differences between two texts using the diff algorithm
version: 0.0.1
copyright:
  name: CrossCompute Inc.
  year: 2024
input:
  variables:
    - id: text1
      view: text
      path: text1.txt
    - id: text2
      view: text
      path: text2.txt
  templates:
    - path: input.md
output:
  variables:
    - id: diff
      view: text
      path: diff.txt
  templates:
    - path: output.md
presets:
  - folder: presets/standard
scripts:
  - command: bash run.sh
display:
  styles:
    - path: style.css
  pages:
    - id: output
      design: none
