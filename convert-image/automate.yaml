---
crosscompute: 0.9.5
name: Convert Image
description: Convert image format
version: 0.0.1
copyright:
  name: CrossCompute Inc.
  year: 2024
input:
  variables:
    - id: image_uri
      view: string
      path: variables.dictionary
output:
  variables:
    - id: image_link
      view: link
      path: image.png
presets:
  - folder: presets/standard
scripts:
  - command: python3 run.py {input_folder} {output_folder} {debug_folder}
environment:
  packages:
    - id: pillow
      manager: pip
    - id: reportlab
      manager: pip
    - id: svglib
      manager: pip
