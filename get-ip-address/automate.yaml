---
crosscompute: 0.9.5
name: Get IP Address
description: Enter a URL to check its IP address or leave blank to see your IP address
version: 0.0.1
copyright:
  name: CrossCompute Inc.
  year: 2024
input:
  variables:
    - id: url
      view: string
      path: variables.dictionary
      label: URL
  templates:
    - path: input.md
output:
  variables:
    - id: ip_addresses
      view: markdown
      path: ip-addresses.txt
      label: IP Address
presets:
  - folder: presets/standard
scripts:
  - command: python3 run.py {input_folder} {debug_folder} {output_folder}
