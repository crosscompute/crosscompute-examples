---
crosscompute: 0.9.5
name: Make QR Code
slug: make-qr
description: Turn text into a QR code
version: 0.0.1
copyright:
  name: CrossCompute Inc.
  year: 2024
input:
  variables:
    - id: data
      view: text
      path: data.txt
  templates:
    - path: input.md
output:
  variables:
    - id: qr
      view: image
      path: qr.png
presets:
  - folder: presets/standard
scripts:
  - path: run.ipynb
display:
  styles:
    - path: style.css
  pages:
    - id: output
      configuration:
        design: none
