---
crosscompute: 0.9.5
name: Make QR Code
slug: make-qr
description: Turn text into a QR code
version: 0.1.1
copyright:
  - name: CrossCompute Inc.
    slug: crosscompute
    years:
      - 2024
      - 2025
input:
  variables:
    - id: data
      view: text
      path: data.txt
  templates:
    - path: input.md
output:
  variables:
    - id: qr
      view: image
      path: qr.png
presets:
  - folder: presets/standard
scripts:
  - path: run.ipynb
environment:
  packages:
    - id: qrcode[pil]
      manager: pip
display:
  styles:
    - path: style.css
  pages:
    - id: output
      configuration:
        design: none
