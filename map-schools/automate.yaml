---
crosscompute: 0.9.4
name: Map Schools
version: 0.0.1
input:
  variables:
    - id: type
      view: string
      path: variables.dictionary
    - id: period
      view: string
      path: variables.dictionary
    - id: uri
      view: string
      path: variables.dictionary
      label: URI
output:
  variables:
    - id: schools
      view: map-deck-screengrid
      path: geometries.json
      configuration:
        style: mapbox://styles/mapbox/dark-v11
  templates:
    - path: output.md
presets:
  - name: '{type | title} Schools {period}'
    folder: presets/{type}-{period}
    configuration:
      path: datasets/presets.csv
scripts:
  - path: run.ipynb
execution:
  packages:
    - id: invisibleroads-macros-disk
      manager: pip
    - id: openpyxl
      manager: pip
    - id: pandas
      manager: pip
display:
  pages:
    - id: tool
      design: none
    - id: output
      design: none
